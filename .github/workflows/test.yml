name: Test Packages
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Comma-separated nx project names to test (empty = all SEAL_PROJECTS)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Sealed build: `nx affected` resolves to nothing on the fork (no origin/main
# delta), so every affected-based step is pinned to the target package plus the
# packages touched by the CVE patch set.
env:
  SEAL_PROJECTS: "@opentelemetry/instrumentation-cassandra-driver,@opentelemetry/instrumentation-amqplib,@opentelemetry/instrumentation-aws-sdk,@opentelemetry/instrumentation-document-load,@opentelemetry/instrumentation-hapi,@opentelemetry/instrumentation-ioredis,@opentelemetry/instrumentation-knex,@opentelemetry/instrumentation-memcached,@opentelemetry/instrumentation-mongodb,@opentelemetry/instrumentation-mongoose,@opentelemetry/instrumentation-mysql,@opentelemetry/instrumentation-mysql2,@opentelemetry/instrumentation-nestjs-core,@opentelemetry/instrumentation-net,@opentelemetry/instrumentation-pg,@opentelemetry/instrumentation-redis,@opentelemetry/instrumentation-tedious,@opentelemetry/sampler-aws-xray"
  SEAL_SERVICES: "cassandra memcached mongodb mssql mysql postgres rabbitmq redis"

jobs:
  compile:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NPM_CONFIG_UNSAFE_PERM: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the same Node.js version used for `release-please` workflow.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 18
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      - name: Compile
        run: npx nx run-many -t compile -p "$SEAL_PROJECTS"

  unit-test:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # redis.cluster.test.ts (a patched path) only runs against a live cluster;
    # upstream has none in CI, so a single-node cluster is started below.
    env:
      RUN_REDIS_CLUSTER_TESTS: "1"
      OPENTELEMETRY_REDIS_CLUSTER_HOST: "127.0.0.1"
      OPENTELEMETRY_REDIS_CLUSTER_PORT: "7001"
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "24"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
        timeout-minutes: 10
      - name: Compile
        run: npx nx run-many -t compile -p "$SEAL_PROJECTS"
      - name: Pack
        if: ${{ matrix.node == '24' }}
        run: |
          mkdir -p /tmp/pack
          npm pack --workspace=packages/instrumentation-cassandra-driver --pack-destination=/tmp/pack
          mv /tmp/pack/opentelemetry-instrumentation-cassandra-driver-0.64.0.tgz /tmp/pack/instrumentation-cassandra-driver-0.64.0.tgz
      - name: Upload Package Artifact
        if: ${{ matrix.node == '24' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-tarball
          path: /tmp/pack/instrumentation-cassandra-driver-0.64.0.tgz
          if-no-files-found: error
      - name: Unit tests (Browser)
        if: ${{ matrix.node == '22' && inputs.test-filter == '' }}
        run: npx nx run-many -t test:browser -p "$SEAL_PROJECTS"
      - name: Start Test Services
        run: |
          for i in 1 2 3; do
            docker compose -f test/docker-compose.yaml up -d --wait $SEAL_SERVICES && break
            if [ "$i" = 3 ]; then exit 1; fi
            docker compose -f test/docker-compose.yaml down
            sleep 10
          done
      - name: Start Redis Cluster
        run: |
          docker run -d --name seal-redis-cluster --network host redis:7 redis-server --port 7001 --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --save "" --appendonly no
          for i in $(seq 1 30); do docker exec seal-redis-cluster redis-cli -p 7001 ping && break; sleep 1; done
          docker exec seal-redis-cluster redis-cli -p 7001 cluster addslotsrange 0 16383
          for i in $(seq 1 30); do docker exec seal-redis-cluster redis-cli -p 7001 cluster info | grep -q cluster_state:ok && break; sleep 1; done
          docker exec seal-redis-cluster redis-cli -p 7001 cluster info | grep cluster_state:ok
      - name: Unit tests (Nodejs)
        run: |
          PROJECTS="${{ inputs.test-filter }}"
          if [ -z "$PROJECTS" ]; then PROJECTS="$SEAL_PROJECTS"; fi
          npx cross-env NODE_OPTIONS='-r dotenv/config' DOTENV_CONFIG_PATH=./test/test-services.env nx run-many -t test -p "$PROJECTS"
      - name: Stop Test Services
        if: always()
        run: |
          if docker inspect seal-redis-cluster >/dev/null 2>&1; then docker rm -f seal-redis-cluster; fi
          npm run test-services:stop
      - name: Report skipped tests
        if: always()
        run: |
          cat <<'SKIPS'
          Pending (skipped) tests in these suites and why:
          - instrumentation-ioredis "should create a child span for pubsub": upstream marks it it.skip (test/ioredis.test.ts).
          - instrumentation-ioredis "should instrument connect with requireParentSpan equal false": upstream marks it it.skip (test/ioredis.test.ts).
          - instrumentation-ioredis "should redact ACL SETUSER arguments in db.statement": this.skip() when the installed ioredis client has no acl() method (older ioredis versions under test-all-versions).
          - instrumentation-aws-sdk "sqs receive context": upstream it.skip; span-context propagation to the SQS ReceiveMessage handler is broken with @aws-sdk/client-sqs >= 3.316.0 (open-telemetry/opentelemetry-js-contrib#1477).
          - instrumentation-redis "redis v4-v5 cluster" (4 tests): skipped unless RUN_REDIS_CLUSTER_TESTS is set; they run against a live single-node cluster in the unit-test job and are skipped in test-all-versions, where upstream never runs them.
          - instrumentation-redis "redis v4-v5 cluster mock" suite: skipped when the installed redis version does not export RedisClusterMultiCommand.
          SKIPS

  test-all-versions:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18"
          - "20"
          - "22"
          - "24"
        # The CVE-touched packages that ship a .tav.yml, split so each leg
        # stays inside the job timeout.
        tav:
          - "instrumentation-mongodb instrumentation-mongoose instrumentation-redis instrumentation-ioredis"
          - "instrumentation-aws-sdk instrumentation-hapi instrumentation-knex instrumentation-amqplib"
          - "instrumentation-nestjs-core instrumentation-tedious instrumentation-mysql2 instrumentation-pg"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        timeout-minutes: 10
      - name: Compile
        run: npx nx run-many -t compile -p "$SEAL_PROJECTS"
      - name: Start Test Services
        run: |
          for i in 1 2 3; do
            docker compose -f test/docker-compose.yaml up -d --wait $SEAL_SERVICES && break
            if [ "$i" = 3 ]; then exit 1; fi
            docker compose -f test/docker-compose.yaml down
            sleep 10
          done
      - name: Test All Versions
        if: ${{ inputs.test-filter == '' }}
        env:
          SEAL_TAV: ${{ matrix.tav }}
        run: npx cross-env NODE_OPTIONS='-r dotenv/config' DOTENV_CONFIG_PATH=./test/test-services.env sh -c 'echo $SEAL_TAV | tr " " "\n" | xargs -I {} -t npm run --if-present test-all-versions -w packages/{}'
      - name: Stop Test Services
        if: always()
        run: npm run test-services:stop
      - name: Report skipped tests
        if: always()
        run: |
          cat <<'SKIPS'
          Pending (skipped) tests in these suites and why:
          - instrumentation-ioredis "should create a child span for pubsub": upstream marks it it.skip (test/ioredis.test.ts).
          - instrumentation-ioredis "should instrument connect with requireParentSpan equal false": upstream marks it it.skip (test/ioredis.test.ts).
          - instrumentation-ioredis "should redact ACL SETUSER arguments in db.statement": this.skip() when the installed ioredis client has no acl() method (older ioredis versions under test-all-versions).
          - instrumentation-aws-sdk "sqs receive context": upstream it.skip; span-context propagation to the SQS ReceiveMessage handler is broken with @aws-sdk/client-sqs >= 3.316.0 (open-telemetry/opentelemetry-js-contrib#1477).
          - instrumentation-redis "redis v4-v5 cluster" (4 tests): skipped unless RUN_REDIS_CLUSTER_TESTS is set; they run against a live single-node cluster in the unit-test job and are skipped in test-all-versions, where upstream never runs them.
          - instrumentation-redis "redis v4-v5 cluster mock" suite: skipped when the installed redis version does not export RedisClusterMultiCommand.
          SKIPS

  coverage-report:
    if: false
    needs: test-all-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 18
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      # Note: Keep this in sync with the node versions from `test-all-versions` job.
      - name: Download Test Artifacts (18)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-18
          path: .
      - name: Download Test Artifacts (20)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-20
          path: .
      - name: Download Test Artifacts (22)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-22
          path: .
      - name: Download Test Artifacts (24)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-24
          path: .
      - name: Report Coverage with Flags
        run: node ./scripts/codecov-upload-flags.mjs
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH_NAME: ${{ github.event.pull_request.head.label }}
